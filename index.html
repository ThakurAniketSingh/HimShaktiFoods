<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ──────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230b2909' rx='7' width='32' height='32'/><path fill='%23f5c842' d='M16 5L6 22h4v5h12v-5h4z'/></svg>" />
    <!-- Apple home-screen icon (no extra PNG needed — SVG data URI works) -->
    <link rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230b2909' rx='7' width='32' height='32'/><path fill='%23f5c842' d='M16 5L6 22h4v5h12v-5h4z'/></svg>" />

    <!-- ── Theme colour (Android Chrome, Safari on iOS) ─────────────── -->
    <meta name="theme-color" content="#0b2909" />

    <!-- ── Primary SEO ───────────────────────────────────────────────── -->
    <title>HimShakti Foods — Pure Himalayan Goodness</title>
    <meta name="description"
      content="Authentic Himalayan millets, wild-berry juices and traditional pickles from Uttarakhand — delivered directly to your door. No preservatives, no middlemen." />
    <meta name="keywords"
      content="himalayan foods, millets, ragi, amaranth, wild berry juice, traditional pickles, uttarakhand, haldwani, himshakti, organic mountain foods, pahadi foods" />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph / WhatsApp / Facebook ─────────────────────────── -->
    <!-- Replace https://yourdomain.com with your real Vercel domain once deployed. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="HimShakti Foods" />
    <meta property="og:title"       content="HimShakti Foods — Pure Himalayan Goodness" />
    <meta property="og:description"
      content="Authentic Himalayan millets, wild-berry juices and traditional pickles from Uttarakhand — delivered directly to your door. No preservatives, no middlemen." />
    <meta property="og:url"         content="https://yourdomain.com" />
    <meta property="og:image"       content="https://yourdomain.com/images/products.webp" />
    <meta property="og:image:alt"   content="HimShakti Foods — Himalayan products" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="HimShakti Foods — Pure Himalayan Goodness" />
    <meta name="twitter:description"
      content="Authentic Himalayan millets, wild-berry juices and traditional pickles from Uttarakhand — delivered directly to your door." />
    <meta name="twitter:image"       content="https://yourdomain.com/images/products.webp" />

    <!-- ── Google Fonts — preconnect first, then stylesheet ─────────── -->
    <!-- dns-prefetch is a lightweight fallback for browsers that don't support preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only when JavaScript is disabled; hidden otherwise by React mounting -->
    <noscript>
      <div style="font-family:sans-serif;text-align:center;padding:3rem">
        <strong>HimShakti Foods</strong> requires JavaScript to run.
        Please enable it in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
